<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkillSwap – Student Skill Exchange</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4fa;--surface:#fff;--ink:#17214d;--muted:#5b6485;--line:#d9deee;--accent:#f2b705;--accent-ink:#17214d;--teal:#0f8b8d;--danger:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10152e;--surface:#1a2145;--ink:#eef1ff;--muted:#a3abcf;--line:#2c3563;--teal:#4fd1c5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10152e;--surface:#1a2145;--ink:#eef1ff;--muted:#a3abcf;--line:#2c3563;--teal:#4fd1c5;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 48px}
h1,h2,h3{margin:0;line-height:1.15}
.brand{font-weight:800;font-size:1.25rem;letter-spacing:-.02em}
.brand span{background:var(--accent);color:var(--accent-ink);padding:0 .3em;border-radius:6px;margin-left:2px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
textarea{resize:vertical;min-height:80px}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.small{padding:7px 12px;font-size:.9rem}
.btn:disabled{opacity:.6;cursor:default}
.hidden{display:none!important}
/* auth */
.auth{display:grid;gap:28px;align-items:center;min-height:80vh}
@media(min-width:800px){.auth{grid-template-columns:1.1fr 1fr}}
.hero h1{font-size:clamp(2.2rem,7vw,3.8rem);font-weight:800;letter-spacing:-.03em}
.hero p{color:var(--muted);max-width:44ch;margin:14px 0 0;font-size:1.1rem}
.swap{display:flex;gap:10px;align-items:center;margin-top:22px;flex-wrap:wrap}
.pill{padding:8px 14px;border-radius:999px;font-weight:600;border:1.5px solid var(--ink)}
.pill.a{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:22px}
.tabs{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:12px;margin-bottom:6px}
.tabs button{flex:1;border:0;background:transparent;padding:9px;border-radius:9px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.err{color:var(--danger);font-size:.9rem;min-height:1.3em;margin:10px 0 0}
.note{color:var(--muted);font-size:.85rem;margin-top:12px}
/* app */
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:16px;border-bottom:1.5px solid var(--line);margin-bottom:22px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:10px}
.grid{display:grid;gap:18px}
@media(min-width:800px){.grid{grid-template-columns:320px 1fr;align-items:start}}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.bar input{flex:1;min-width:140px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:grid;gap:12px}
.item{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px;border-left:6px solid var(--teal)}
.item.want{border-left-color:var(--accent)}
.item h3{font-size:1.1rem}
.meta{color:var(--muted);font-size:.88rem;margin:2px 0 8px}
.tag{font-weight:700;font-size:.8rem;padding:2px 9px;border-radius:999px;background:var(--teal);color:#fff;margin-right:6px}
.item.want .tag{background:var(--accent);color:var(--accent-ink)}
.item p{margin:0 0 12px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:14px}
.req{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;max-width:90vw}
@media(prefers-reduced-motion:no-preference){.item{transition:transform .15s}.item:hover{transform:translateY(-2px)}}
</style>
</head>
<body>
<div class="wrap">

<!-- LOGIN / SIGN UP -->
<section id="authView" class="auth hidden">
  <div class="hero">
    <div class="brand">Skill<span>Swap</span></div>
    <h1 style="margin-top:18px">You know something. Someone else needs it.</h1>
    <p>Trade skills with students on your campus. Teach guitar, get help with calculus. No money, just a fair swap.</p>
    <div class="swap"><span class="pill a">I can teach Python</span><span aria-hidden="true">⇄</span><span class="pill">I want to learn Spanish</span></div>
  </div>
  <div class="card">
    <div class="tabs" role="tablist">
      <button role="tab" id="tabLogin" aria-selected="true">Log in</button>
      <button role="tab" id="tabSignup" aria-selected="false">Sign up</button>
    </div>
    <div id="authForm">
      <div id="nameRow" class="hidden"><label for="fName">Full name</label><input id="fName" autocomplete="name"></div>
      <div id="courseRow" class="hidden"><label for="fCourse">Course or year</label><input id="fCourse" placeholder="e.g. BSc Computer Science, Year 2"></div>
      <label for="fEmail">Student email</label><input id="fEmail" type="email" autocomplete="email">
      <label for="fPass">Password</label><input id="fPass" type="password" autocomplete="current-password">
      <p class="err" id="authErr" role="alert"></p>
      <button class="btn" id="authBtn" style="width:100%;margin-top:6px">Log in</button>
      <p class="note">Demo app: accounts are saved only in this browser.</p>
    </div>
  </div>
</section>

<!-- MAIN APP -->
<section id="appView" class="hidden">
  <header class="top">
    <div class="brand">Skill<span>Swap</span></div>
    <div class="who"><span id="hello"></span><button class="btn ghost small" id="logout">Log out</button></div>
  </header>
  <div class="grid">
    <aside class="card">
      <h2 style="font-size:1.2rem">Post a skill</h2>
      <label for="pType">I want to…</label>
      <select id="pType"><option value="offer">Teach a skill</option><option value="want">Learn a skill</option></select>
      <label for="pSkill">Skill</label><input id="pSkill" placeholder="e.g. Guitar basics">
      <label for="pCat">Category</label>
      <select id="pCat"><option>Tech</option><option>Languages</option><option>Music</option><option>Academics</option><option>Creative</option><option>Fitness</option><option>Other</option></select>
      <label for="pDesc">Details</label><textarea id="pDesc" placeholder="Your level, when you are free, what you would like in return"></textarea>
      <p class="err" id="postErr" role="alert"></p>
      <button class="btn" id="postBtn" style="width:100%">Post skill</button>
    </aside>
    <main>
      <div class="bar">
        <input id="q" type="search" placeholder="Search skills or categories" aria-label="Search skills">
        <button class="chip" data-f="all" aria-pressed="true">All</button>
        <button class="chip" data-f="offer" aria-pressed="false">Offers</button>
        <button class="chip" data-f="want" aria-pressed="false">Wants</button>
      </div>
      <div class="list" id="list" aria-live="polite"></div>
      <section class="card" style="margin-top:18px"><h2 style="font-size:1.2rem;margin-bottom:8px">Swap requests</h2><div id="inboxBody"></div></section>
    </main>
  </div>
</section>
</div>
<div class="toast hidden" id="toast" role="status"></div>

<script>
const $=id=>document.getElementById(id);
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const seed=[
 {id:1,type:'offer',skill:'Python for beginners',cat:'Tech',desc:'Happy to cover loops, functions and small projects. Free on weekday evenings.',by:'Aisha K.',course:'Computer Science, Year 3'},
 {id:2,type:'want',skill:'Conversational Spanish',cat:'Languages',desc:'Planning an exchange semester. Can swap for help with statistics.',by:'Tom R.',course:'Economics, Year 2'},
 {id:3,type:'offer',skill:'Acoustic guitar',cat:'Music',desc:'Chords, strumming and simple songs. Weekends work best.',by:'Mei L.',course:'Biology, Year 1'},
 {id:4,type:'offer',skill:'Calculus I tutoring',cat:'Academics',desc:'Limits, derivatives and exam practice.',by:'Daniel O.',course:'Mathematics, Year 4'},
 {id:5,type:'want',skill:'Photo editing in Lightroom',cat:'Creative',desc:'Need help for a portfolio. Can teach basic web design in return.',by:'Sara P.',course:'Design, Year 2'}
];
let users=store.get('sx_users',[]);
let skills=store.get('sx_skills',seed);
let me=(()=>{const s=store.get('sx_session',null);const em=s&&(s.email||s);return users.find(u=>u.email===em)||null})();
let reqs=store.get('sx_reqs',[]);if(!Array.isArray(reqs))reqs=[];
let mode='login',filter='all';

function show(){
  $('authView').classList.toggle('hidden',!!me);
  $('appView').classList.toggle('hidden',!me);
  if(me){$('hello').textContent='Hi, '+me.name.split(' ')[0];render();renderInbox()}
}
function toast(t){const el=$('toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add('hidden'),2200)}

async function hash(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('skillswap:'+p));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return p}}
/* auth */
function setMode(m){
  mode=m;const s=m==='signup';
  $('tabLogin').setAttribute('aria-selected',!s);$('tabSignup').setAttribute('aria-selected',s);
  $('nameRow').classList.toggle('hidden',!s);$('courseRow').classList.toggle('hidden',!s);
  $('authBtn').textContent=s?'Create account':'Log in';
  $('fPass').autocomplete=s?'new-password':'current-password';
  $('authErr').textContent='';
}
$('tabLogin').onclick=()=>setMode('login');
$('tabSignup').onclick=()=>setMode('signup');
$('authBtn').onclick=async()=>{
  const email=$('fEmail').value.trim().toLowerCase(),raw=$('fPass').value,err=$('authErr');
  if(!/^\S+@\S+\.\S+$/.test(email)){err.textContent='Enter a valid email address.';return}
  if(raw.length<6){err.textContent='Use a password with at least 6 characters.';return}
  const pass=await hash(raw);
  if(mode==='signup'){
    const name=$('fName').value.trim();
    if(!name){err.textContent='Enter your full name.';return}
    if(users.some(u=>u.email===email)){err.textContent='This email already has an account. Log in instead.';return}
    const u={email,pass,name,course:$('fCourse').value.trim()||'Student'};
    users.push(u);store.set('sx_users',users);me=u;
  }else{
    const u=users.find(u=>u.email===email&&(u.pass===pass||u.pass===raw));
    if(!u){err.textContent='Email or password is incorrect.';return}
    me=u;
  }
  store.set('sx_session',me.email);err.textContent='';['fPass','fName','fCourse'].forEach(i=>$(i).value='');show();
};
$('authForm').addEventListener('keydown',e=>{if(e.key==='Enter')$('authBtn').click()});
$('logout').onclick=()=>{me=null;store.set('sx_session',null);setMode('login');show()};

/* skills */
$('postBtn').onclick=()=>{
  const skill=$('pSkill').value.trim(),desc=$('pDesc').value.trim();
  if(!skill){$('postErr').textContent='Name the skill you want to post.';return}
  skills.unshift({id:Date.now(),type:$('pType').value,skill,cat:$('pCat').value,desc:desc||'No details added yet.',by:me.name,course:me.course,email:me.email});
  store.set('sx_skills',skills);
  $('pSkill').value='';$('pDesc').value='';$('postErr').textContent='';
  render();toast('Skill posted');
};
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
  filter=c.dataset.f;
  document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===c));
  render();
});
$('q').oninput=render;

function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){
  const q=$('q').value.toLowerCase();
  const mine=reqs.filter(r=>r.fromEmail===me.email).map(r=>r.skillId);
  const rows=skills.filter(s=>(filter==='all'||s.type===filter)&&(s.skill+s.cat+s.desc).toLowerCase().includes(q));
  $('list').innerHTML=rows.length?rows.map(s=>{
    const own=s.email===me.email,sent=mine.includes(s.id);
    return `<article class="item ${s.type}">
      <h3>${esc(s.skill)}</h3>
      <div class="meta"><span class="tag">${s.type==='offer'?'Teaching':'Learning'}</span>${esc(s.cat)} · ${esc(s.by)}, ${esc(s.course)}</div>
      <p>${esc(s.desc)}</p>
      ${own?'<button class="btn ghost small" data-del="'+s.id+'">Remove my post</button>'
        :'<button class="btn small" data-req="'+s.id+'" '+(sent?'disabled':'')+'>'+(sent?'Request sent':'Request swap')+'</button>'}
    </article>`}).join(''):'<div class="empty">No skills match yet. Post one to start a swap.</div>';
}
$('list').onclick=e=>{
  const r=e.target.dataset.req,d=e.target.dataset.del;
  if(r){const s=skills.find(x=>x.id===+r);if(s&&!reqs.some(q=>q.skillId===s.id&&q.fromEmail===me.email)){reqs.push({id:Date.now(),skillId:s.id,skill:s.skill,fromEmail:me.email,fromName:me.name,toEmail:s.email||'',toName:s.by,status:'pending'});store.set('sx_reqs',reqs);render();renderInbox();toast('Swap request sent')}}
  if(d){skills=skills.filter(s=>s.id!==+d);store.set('sx_skills',skills);render();toast('Post removed')}
};
function renderInbox(){
  const inc=reqs.filter(r=>r.toEmail===me.email),out=reqs.filter(r=>r.fromEmail===me.email);
  const st={pending:'Waiting for a reply',accepted:'Accepted',declined:'Declined'};
  const rowIn=r=>`<div class="req"><div><strong>${esc(r.fromName)}</strong> wants to swap for ${esc(r.skill)}<div class="meta">${esc(r.fromEmail)}</div></div>${r.status==='pending'?`<span><button class="btn small" data-acc="${r.id}">Accept</button> <button class="btn ghost small" data-dec="${r.id}">Decline</button></span>`:`<span class="meta">${st[r.status]}</span>`}</div>`;
  const rowOut=r=>`<div class="req"><div><strong>${esc(r.skill)}</strong> with ${esc(r.toName)}<div class="meta">${st[r.status]}${r.status==='accepted'&&r.toEmail?' · Contact: '+esc(r.toEmail):''}</div></div></div>`;
  $('inboxBody').innerHTML='<h3 style="font-size:1rem">Received</h3>'+(inc.length?inc.map(rowIn).join(''):'<p class="meta">No requests on your posts yet.</p>')+'<h3 style="font-size:1rem;margin-top:14px">Sent</h3>'+(out.length?out.map(rowOut).join(''):'<p class="meta">You have not requested a swap yet.</p>');
}
$('inboxBody').onclick=e=>{const a=e.target.dataset.acc,d=e.target.dataset.dec,id=+(a||d);if(!id)return;const r=reqs.find(x=>x.id===id);if(r){r.status=a?'accepted':'declined';store.set('sx_reqs',reqs);renderInbox();toast(a?'Request accepted':'Request declined')}};
show();
</script>
</body>
</html>
